<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzón de Tareas</title>

  <!----------------------------------------------CSS GOBIERNO------------------------------------------------->
  <link href="https://framework-gb.cdn.gob.mx/gm/v4/image/favicon.ico" rel="shortcut icon">
  <link href="https://framework-gb.cdn.gob.mx/gm/v4/css/main.css" rel="stylesheet">

  <!-- CUSTOM CSS -->
  <link href="../static/css/style.css" rel="stylesheet">

  <!------------------------------------------ICONOS----------------------------------------------------------->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
  <main class="page">
    <div class="container">

      <!-----------------------------------------LOGO---------------------------------------------------------->
    <a href="https://www.gob.mx/buengobierno" target="_blank">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/f/fc/Buen_gobierno.svg"
             alt="Buen Gobierno">
    </a>

    <div class="header-bar">
    <h2>INICIO</h2>
    <hr class="red" style="padding:0; margin-bottom:20px;">
    <label>User: LAJD980625NZ5</label>
    <btn id="home-button" class="btn btn-secondary" href="{{ url_for('home') }}">Volver al inicio</btn>

    <h2>Buzón de Tareas</h2>
    <table>
  <thead>
    <tr>
      <th>Id de la tarea</th>
      <th>Clave de solicitud</th>
      <th>Fecha de asignación de tarea</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody>
    {% for tarea in tareas %}
    <tr>
      <td>{{ tarea.id }}</td>
      <td>{{ tarea.identificador }}</td>
      <td>{{ tarea.fecha_firmada }}</td>
      <td>
        <a href="{{ url_for('emisionAvaluo', clave_solicitud=tarea.identificador) }}">
          Ir a Formulario
        </a>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="4">No hay tareas registradas.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
    <br>
    <br>
    </div>
  </main>

  <!-- JS -->
  <script src="https://framework-gb.cdn.gob.mx/gm/v4/js/gobmx.js"></script>
</body>
</html>
